[package]
name = "picotalk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "TashTalk-compatible LocalTalk interface for the RP2350"

[dependencies]
llap = { path = "../llap", features = ["defmt"] }

embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info", "executor-thread"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt"], optional = true }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["defmt", "udp", "dhcpv4", "medium-ethernet", "multicast", "proto-ipv4"], optional = true }
cyw43 = { version = "0.7.0", features = ["defmt"], optional = true }
cyw43-pio = { version = "0.10.0", features = ["defmt"], optional = true }
embedded-io-async = "0.7.0"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1"

[features]
default = ["host-uart"]
## Talk to the host over UART0 (1 Mbaud, 8N1, RTS flow control), like a TashTalk chip.
host-uart = []
## Talk to the host over USB CDC-ACM instead.
host-usb = ["dep:embassy-usb"]
## Pico 2 W: bridge LocalTalk straight to LToUDP over Wi-Fi (no host).
ltoudp = ["dep:embassy-net", "dep:cyw43", "dep:cyw43-pio"]

[profile.release]
debug = true
lto = true
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 1
