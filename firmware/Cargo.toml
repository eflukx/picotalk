[package]
name = "picotalk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "TashTalk-compatible LocalTalk interface for the RP2350 and RP2040"

[dependencies]
llap = { path = "../llap", features = ["defmt"] }

embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "executor-thread"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt"], optional = true }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["defmt", "udp", "dhcpv4", "medium-ethernet", "multicast", "proto-ipv4"], optional = true }
cyw43 = { version = "0.7.0", features = ["defmt"], optional = true }
cyw43-pio = { version = "0.10.0", features = ["defmt"], optional = true }
embedded-io-async = "0.7.0"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1"
# The RP2040's Cortex-M0+ has no atomic compare-and-swap; this gives crates
# like static_cell one through a critical section (native on the RP2350).
portable-atomic = { version = "1.11", features = ["critical-section"] }

[features]
default = ["rp2350", "host-uart"]

## Chip, pick one. RP2350: Pico 2 / Pico 2 W, target thumbv8m.main-none-eabihf
## (the default in .cargo/config.toml).
rp2350 = ["embassy-rp/rp235xa", "embassy-rp/binary-info"]
## RP2040: Pico / Pico W, target thumbv6m-none-eabi.
rp2040 = ["embassy-rp/rp2040"]

## Talk to the host over UART0 (1 Mbaud, 8N1, RTS flow control), like a TashTalk chip.
host-uart = []
## Talk to the host over USB CDC-ACM instead.
host-usb = ["dep:embassy-usb"]
## Pico 2 W: bridge LocalTalk straight to LToUDP over Wi-Fi (no host).
ltoudp = ["dep:embassy-net", "dep:cyw43", "dep:cyw43-pio"]

[profile.release]
debug = true
lto = true
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 1
