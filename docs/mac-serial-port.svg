<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" viewBox="0 0 540 320" role="img" aria-label="Macintosh mini-DIN-8 serial port, looking into the socket on the Mac with the key notch up. Top row: 8 RxD+, 7 GPi, 6 TxD+. Middle row: 5 RxD-, then 4 GND and 3 TxD- close together on the right. Bottom row: 2 HSKi/CLK, 1 HSKo.">
  <title>Macintosh serial port (mini-DIN-8), looking into the Mac's socket</title>
  <style>
    .shell { fill: #b8bcc2; stroke: #333; stroke-width: 1.5 }
    .body  { fill: #f4f4f4; stroke: #333; stroke-width: 1.2; stroke-linejoin: round }
    .pin   { fill: #fff; stroke: #333; stroke-width: 1.2 }
    .tx    { fill: #4c9be8 }
    .rx    { fill: #f0923a }
    .gnd   { fill: #6b6b6b }
    .lead  { stroke: #555; stroke-width: 1; fill: none }
    .num   { font: bold 12px Arial, Helvetica, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: central }
    .num.inv { fill: #fff }
    .sig   { font: bold 14px Arial, Helvetica, sans-serif; fill: #222 }
    .dir   { font: 11px Arial, Helvetica, sans-serif; fill: #666 }
    .note  { font: italic 12px Arial, Helvetica, sans-serif; fill: #666; text-anchor: middle }
    @media (prefers-color-scheme: dark) {
      .shell { fill: #5b6068; stroke: #ccc }
      .body  { fill: #2a2d31; stroke: #ccc }
      .pin   { fill: #1b1d20; stroke: #ccc }
      .lead  { stroke: #aaa }
      .num   { fill: #eee }
      .sig   { fill: #e6e6e6 }
      .dir, .note { fill: #aaa }
      .gnd   { fill: #9a9a9a }
    }
  </style>
  <circle class="shell" cx="270" cy="150" r="92"/>
  <path class="body" d="M 260.0 72.6 A 78 78 0 0 0 195.5 173.0 L 217.6 173.0 L 217.6 207.7 A 78 78 0 0 0 322.4 207.7 L 322.4 173.0 L 344.5 173.0 A 78 78 0 0 0 280.0 72.6 L 280.0 82.4 L 260.0 82.4 Z"/>
  <line class="lead" x1="228.2" y1="108.2" x2="150" y2="108.2"/>
  <line class="lead" x1="215.7" y1="150.0" x2="150" y2="150.0"/>
  <line class="lead" x1="244.7" y1="191.5" x2="150" y2="191.5"/>
  <line class="lead" x1="311.8" y1="108.2" x2="390" y2="108.2"/>
  <line class="lead" x1="323.4" y1="150.0" x2="390" y2="150.0"/>
  <line class="lead" x1="295.3" y1="191.5" x2="390" y2="191.5"/>
  <line class="lead" x1="270.0" y1="107.3" x2="270.0" y2="38"/>
  <polyline class="lead" points="285.6,150.0 270.0,191.5 270.0,262"/>
  <circle class="rx" cx="228.2" cy="108.2" r="12" stroke="#333" stroke-width="1.2"/><text class="num inv" x="228.2" y="108.2">8</text>
  <circle class="pin" cx="270.0" cy="107.3" r="12"/><text class="num" x="270.0" y="107.3">7</text>
  <circle class="tx" cx="311.8" cy="108.2" r="12" stroke="#333" stroke-width="1.2"/><text class="num inv" x="311.8" y="108.2">6</text>
  <circle class="rx" cx="215.7" cy="150.0" r="12" stroke="#333" stroke-width="1.2"/><text class="num inv" x="215.7" y="150.0">5</text>
  <circle class="gnd" cx="285.6" cy="150.0" r="12" stroke="#333" stroke-width="1.2"/><text class="num inv" x="285.6" y="150.0">4</text>
  <circle class="tx" cx="323.4" cy="150.0" r="12" stroke="#333" stroke-width="1.2"/><text class="num inv" x="323.4" y="150.0">3</text>
  <circle class="pin" cx="244.7" cy="191.5" r="12"/><text class="num" x="244.7" y="191.5">2</text>
  <circle class="pin" cx="295.3" cy="191.5" r="12"/><text class="num" x="295.3" y="191.5">1</text>
  <text class="sig" x="144" y="113.2" text-anchor="end">8 · RxD+</text>
  <text class="dir" x="144" y="128.2" text-anchor="end">Pico → Mac</text>
  <text class="sig" x="144" y="155.0" text-anchor="end">5 · RxD−</text>
  <text class="dir" x="144" y="170.0" text-anchor="end">Pico → Mac</text>
  <text class="sig" x="144" y="196.5" text-anchor="end">2 · HSKi/CLK</text>
  <text class="dir" x="144" y="211.5" text-anchor="end">not used</text>
  <text class="sig" x="396" y="113.2" text-anchor="start">6 · TxD+</text>
  <text class="dir" x="396" y="128.2" text-anchor="start">Mac → Pico</text>
  <text class="sig" x="396" y="155.0" text-anchor="start">3 · TxD−</text>
  <text class="dir" x="396" y="170.0" text-anchor="start">Mac → Pico</text>
  <text class="sig" x="396" y="196.5" text-anchor="start">1 · HSKo</text>
  <text class="dir" x="396" y="211.5" text-anchor="start">not used</text>
  <text class="sig" x="270.0" y="22" text-anchor="middle">7 · GPi</text>
  <text class="dir" x="318.0" y="22">not used</text>
  <text class="sig" x="270.0" y="280" text-anchor="middle">4 · GND</text>
  <text class="note" x="270" y="308">looking into the Mac's socket, key notch up</text>
</svg>
